# proofbridge-send: Cloudflare Worker on Dennis's own account.
# Secrets (set in the Cloudflare dashboard, never in this file): SMTP_USER, SMTP_PASS (the ask@proofbridge.nl mailbox).
name = "proofbridge-send"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
keep_vars = true

[vars]
ALLOWED_ORIGINS = "https://proofbridge.nl,https://www.proofbridge.nl"
MAIL_TO = "ask@proofbridge.nl"
SMTP_HOST = "mail.privateemail.com"
SMTP_PORT = "465"
AGENT_PRICE_SATS = "100"   # his line 2026-10-29: agents pay 100 sats per request; 0 switches the rail off
PERSON_PRICE_SATS = "100"  # test of the paid journey for people via /ask/pay/ (his remark 2026-10-31 16:51); 0 closes /person

# Agent door (/agent): at most 2 requests per minute per address. The binding is created on deploy.
[[ratelimits]]
name = "AGENT_LIMIT"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

[observability]
enabled = false
