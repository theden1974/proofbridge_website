<style>
  .doors { display: flex; gap: 0.6rem; margin-top: 1.4rem; flex-wrap: wrap; }
  .doors button { font: inherit; font-family: var(--mono); font-size: var(--s-1); text-transform: uppercase; letter-spacing: 0.06em; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 2rem; padding: 0.5rem 1rem; cursor: pointer; }
  .doors button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 1.4rem; align-items: start; }

  .thread { display: grid; gap: 0.7rem; min-height: 8rem; }

  .heard li.next::before { content: "○"; color: var(--accent); }

  @media (max-width: 860px) { .two, .row { grid-template-columns: 1fr; } }
  @media (prefers-color-scheme: dark) { textarea, input, .msg.pb { background: #1a191e; } .msg.me { background: var(--ink); color: #111014; } .btn { background: var(--ink); color: #111014; } .doors button[aria-pressed="true"] { background: var(--ink); color: #111014; } }

</head>
<body>
<div class="wrap">
<header class="bar">
  <a class="label" href="/">proofbridge</a>
  <span class="label">__STATUS__</span>
</header>
<section class="intro" aria-labelledby="h1">
  <span class="label">↳ ask</span>
  <h1 id="h1">__TITLE__</h1>

<div class="doors" role="tablist">

<div class="two">

  <div class="row">

  </div>

    <label><input type="radio" name="tier" value="2"> <span><b>__T2__</b> · __T2S__ sats<br><small class="status">__T2G__</small></span></label>
  </div></fieldset>
  <div class="actions">
    <a class="btn" id="send" href="#">__SEND__</a>
    <button class="btn" type="button" id="copy">__COPY__</button>
    <span class="status">__SEND_NOTE__ <a href="mailto:__MAIL__">__MAIL__</a></span>
  </div>
  <p class="how" style="max-width:60ch">__AFTER__</p>
</section>

<footer>
  <span class="label">↳ connect</span>
  <a href="mailto:__MAIL__">__MAIL__</a>
  <p class="agents label">↳ __CONTRACT_LINE__</p>
</footer>
</div>
<script>
// Arm B: the left side only asks; the right side is the conclusion, in the asker's words, editable in place. Arm A: a pasted AI chat read for the same lines.
// Rules only, no model; nothing leaves the page until send. Script version __SCRIPT_VERSION__. Texts from src/ask.json.
const CH = __CHUNKS_JSON__, OBJ = __OBJECTS_JSON__, T = __TURNS_JSON__, G = __GLOSSARY_JSON__;
const L = {collected: "__COLLECTED__", open: "__OPEN__", first: "__FIRST_PROMPT__", progress: "__PROGRESS__", gfallback: "__GLOSSARY_FALLBACK__"};
const RX = {
  who: /\b(i am|i'm|we are|we're|my (team|client|boss|manager|director|board|company|organisation|organization|shop|practice|firm)|our (team|client|board|company|users?|customers?|staff|employees?|clients?)|the (board|director|ceo|cto|manager|management|founder|owner|municipality|authority|hospital|school|agency|minister|council)|owner of|lead at|work(s|ing)? (at|for)|(policy )?advis[eo]r|project lead|product owner|nurse|doctor|lawyer|architect|developer|designer|researcher|recruiter|consultant|patients?|elderly|residents?|applicants?|employees?|staff|users?|for a client|my client|the client|the customer|(she|he|they) decides?|decides)\b/i,
  current: /\b(doesn'?t|don'?t|does not|do not|can'?t|cannot|won'?t|isn'?t|aren'?t|wasn'?t|not (sure|tracking|working|getting|converting|enough|clear|happening|used|using|what)|unsure|wrong|fail(s|ed|ing)?|complain(s|ed|t|ts)?|slow|unclear|stuck|nobody|no one|drop(ped|s)? ?(off)?|abandon|churn|late|delays?|double (entry|work)|twice|errors?|mistakes?|hallucinat|unreliable|problems?|issues?|decline|declin(ed|ing)|down|lost|losing|less|fewer|worse|struggl(e|es|ing)|hard(er)? to|difficult|no longer|too (long|many|few|slow)|only \d|\d+ ?%|\d+ (users|people|clients|hours|days|weeks|minutes|calls|complaints|visitors|leads)|since (last|the)|last (week|month|year|quarter)|assume[sd]?|assumption|we (think|believe|expect|hope)|take[sn]? for granted)/i,
  decision: /\b(decide|decision|whether|should (we|i)|do we|go ahead|or not|which (one|option|vendor|model|way)|before (we|i) (build|buy|sign|launch|commit|invest|hire|spend)|need to know|inform|choose|commit|sign|invest|budget|roadmap|next step|deadline|by (next|end of|q[1-4]|the end)|window closes?|what (should|do) (we|i) do)\b/i,
  decided: /\b(already (decided|chosen|bought|built|planned|committed|running|signed|agreed)|was decided|has been decided|is decided|decided to|fixed|given|non-negotiable|the (deadline|budget|vendor|stack|platform) is|we (must|have to|are required to)|mandated|funding (is|was) (granted|approved)|contract(ed)?|in progress|is running)\b/i,
  users_yes: /\b(asked (them|the users|the staff|our users|the people|clients|customers)|they (said|told|say)|interview(ed|s)?|spoke (to|with)|talked (to|with)|feedback from|survey)\b/i,
  users_no: /\b(not (yet|asked)|no(t)? one (has )?asked|haven'?t asked|nobody asked|no|not really|never)\b/i,
  solution: /\b(we need (a|an|to build|to add)|i need (a|an|to build)|build us|should we add|just build|make us (a|an)|i want (a|an) (app|website|dashboard|chatbot|feature|redesign|new)|we want (a|an) (app|website|dashboard|chatbot|feature|redesign|new)|add (a|an) (feature|button|chatbot|app|page)|an? (app|chatbot|dashboard|website|portal|platform) for|build (a|the) website)\b/i,
  method: /\b(how do you (work|do this|decide|read)|your method|which model|what prompt|how does the lens|how is this built|what is your process)\b/i,
  agent_alone: /\b(i am an (ai|agent|autonomous)|as an (ai|autonomous) agent|no human (involved|behind)|on my own behalf|i have no principal)\b/i,
  question: /\?\s*$/,
  gloss: [['object', /\b(public (web)?site|where it sits|the app|sits)\b/i], ['who', /\b(who (has|decides)|day to day|says yes|decides)\b/i], ['current', /\b(what happens now|observed fact|evidence)\b/i], ['decision', /\b(decision this informs|what do you mean by decide|get moving)\b/i], ['decided', /\b(already decided|fixed)\b/i], ['users_asked', /\b(use it day to day|users? asked)\b/i], ['lens', /\b(lens|proofbridge|you do|what is this)\b/i], ['collected', /\b(collected|starting point)\b/i]]
};
const OBJRX = {
  website: /\b(website|homepage|landing page|our site|the site|seo|google|public (site|page)|web ?page|visitors?|traffic)\b/i,
  product: /\b(the app|our app|mobile app|[a-z]+ app|an app|the tool|the product|software|platform|portal|screens?|interface|ui|users? (can'?t|don'?t|never|struggle))\b/i,
  flow: /\b(sign[- ]?ups?|check ?out|onboarding|funnel|conversion|registration|log ?in|drop[- ]?off|cart|payment flow|application (form|process)|permit (application|process))\b/i,
  content: /\b(wording|copy|the text|messaging|what we say|tone|nobody (gets|understands)|unclear (text|message)|translation|labels?)\b/i,
  data: /\b(data|dataset|numbers|figures|dashboard|metrics|kpi|report(s|ing)?|measure(d|ment)?|statistics?|model (is|was) trained|training data|entries|records?|sensor)\b/i,
  ai_output: /\b(ai[- ]generated|generated by|chatgpt|copilot|claude|gemini|llm|the summary|summar(y|ised|ized)|the output|a script|draft(ed)? by ai|hallucinat)\b/i,
  organisation: /\b(team|organisation|organization|department|who owns|ownership|no designer|headcount|workforce|staff|culture|stakeholders?|silo|management|new clients|customers)\b/i,
  process: /\b(how we work|process|hand ?off|workflow|way of working|takes forever|approval (takes|process)|procedure|meetings?|double entry|legacy system)\b/i,
  strategy: /\b(strategy|roadmap|the boss wants|which one|direction|priorit(y|ies|ise|ize)|invest|30 ?%|cut|budget|vision|positioning|age of ai)\b/i
};
const S = { lines: {}, awaiting: null, asked: {}, said: [], arm: 'tell', collectedSaid: false, lastPb: '' };
for (const c of CH) S.lines[c.id] = {text: null, inferred: false};
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fill(tpl, q, label){ return tpl.replace('{q}', q || '').replace('{label}', label || ''); }
function sentences(t){ return t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s => s.length > 2); }
function objectOf(t){ const sc = Object.entries(OBJRX).map(([k,rx]) => [k, (t.match(new RegExp(rx.source,'gi'))||[]).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]); return sc.length ? OBJ.find(o => o.id === sc[0][0]) : null; }
function say(who, text){ if (who === 'pb' && text === S.lastPb) return; if (who === 'pb') S.lastPb = text; const d = document.createElement('div'); d.className = 'msg ' + who; d.textContent = text; $('thread').appendChild(d); d.scrollIntoView({block:'nearest'}); }
function setLine(id, text, inferred){ S.lines[id] = {text, inferred: !!inferred}; }
function required(){ return CH.filter(c => c.required).map(c => c.id); }
function has(id){ return !!S.lines[id].text; }
function collected(){ return required().every(has); }
function read(text){
  const ss = sentences(text); const isSol = RX.solution.test(text);
  if (isSol && !has('decided')) setLine('decided', ss.find(x => RX.solution.test(x)) || ss[0]);
  const used = new Set(Object.values(S.lines).map(l => l.text).filter(Boolean));
  for (const [id, rx] of [['who', RX.who], ['current', RX.current], ['decision', RX.decision]]) {
    if (has(id)) continue;
    const cands = ss.filter(x => rx.test(x) && !(isSol && RX.solution.test(x)));
    const s = cands.find(x => !used.has(x)) || cands[0];
    if (s) { setLine(id, s); used.add(s); }
  }
  if (!has('decided') && !isSol) { const s = ss.find(x => RX.decided.test(x)); if (s) setLine('decided', s); }
  if (!has('object')) { const o = objectOf(S.said.join(' ') + ' ' + text); if (o) setLine('object', o.label, true); }
  if (!has('users_asked')) { const s = ss.find(x => RX.users_yes.test(x)); if (s) setLine('users_asked', s); }
  return isSol;
}
function nextId(isSol){
  const order = isSol ? ['current','object','decision','who'] : ['object','decision','who','current'];
  for (const id of order) if (!has(id)) return id;
  if (!has('users_asked')) return 'users_asked';
  return null;
}
function ask(id){ if (!id) return; S.awaiting = id; const again = S.asked[id] && T.ask_again[id]; S.asked[id] = (S.asked[id] || 0) + 1; say('pb', again ? T.ask_again[id] : T.ask[id]); }
function render(){
  const nxt = nextId(false);
  $('lines').innerHTML = CH.map(c => { const l = S.lines[c.id]; const text = l.text || (c.required ? '' : c.default);
    const cls = (l.text ? 'ok' : (c.id === nxt && !collected() ? 'next' : '')) + (c.required ? '' : ' opt') + (l.text ? '' : ' inf');
    return '<li class="' + cls + '" data-id="' + c.id + '"><b>' + esc(c.label) + '</b>' + (text ? '<q class="' + (l.text && !l.inferred ? '' : 'inf') + '" contenteditable="true" spellcheck="false" data-id="' + c.id + '">' + esc(text) + '</q>' : '') + '</li>'; }).join('');
  const n = required().filter(has).length, m = required().length; $('progress').textContent = L.progress.replace('{n}', n).replace('{m}', m);
  const ok = collected(); $('state').textContent = ok ? L.collected : L.open; $('step2').classList.toggle('on', ok);
  if (ok && !S.collectedSaid) { S.collectedSaid = true; say('pb', T.collected); }
  refresh();
}
function answerQuestion(text){ for (const [k, rx] of RX.gloss) if (rx.test(text)) return G[k]; return null; }
function turn(text){
  text = text.trim(); if (!text) return; say('me', text);
  if (RX.method.test(text)) { say('pb', T.method); return; }
  if (RX.agent_alone.test(text)) { say('pb', T.agent_alone); return; }
  if (RX.question.test(text) && !RX.decision.test(text) && text.split(/\s+/).length <= 14) {
    const g = answerQuestion(text); say('pb', (g || L.gfallback) + (S.awaiting ? ' ' + T.ask[S.awaiting] : '')); if (S.awaiting) S.asked[S.awaiting] = (S.asked[S.awaiting] || 0); return;
  }
  S.said.push(text);
  if (S.awaiting === 'users_asked') { if (RX.users_no.test(text) && !RX.users_yes.test(text)) setLine('users_asked', CH.find(c=>c.id==='users_asked').default, true); else setLine('users_asked', text); S.awaiting = null; say('pb', T.noted); render(); return; }
  const isSol = read(text);
  if (S.awaiting && !has(S.awaiting)) setLine(S.awaiting, text);
  if (isSol && !has('current')) { const d = S.lines.decided.text; say('pb', fill(T.solution, d.length > 90 ? d.slice(0,90) + '…' : d)); S.awaiting = 'current'; S.asked.current = (S.asked.current || 0) + 1; render(); return; }
  S.awaiting = null; render();
  const n = nextId(false); if (n) ask(n);
}
$('compose').addEventListener('submit', () => { const t = $('say').value; $('say').value = ''; turn(t); $('say').focus(); });
$('say').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('compose').requestSubmit(); } });
$('lines').addEventListener('focusout', e => { const q = e.target.closest('q[data-id]'); if (!q) return; const v = q.textContent.trim(); const id = q.dataset.id; const c = CH.find(x => x.id === id);
  if (v && v !== (S.lines[id].text || c.default)) { setLine(id, v); say('pb', T.edited); render(); } });
$('lines').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('q[data-id]')) { e.preventDefault(); e.target.blur(); } });
$('door-tell').onclick = () => { S.arm = 'tell'; $('tell').classList.add('on'); $('chat').classList.remove('on'); $('door-tell').setAttribute('aria-pressed','true'); $('door-chat').setAttribute('aria-pressed','false'); };
$('door-chat').onclick = () => { S.arm = 'chat'; $('chat').classList.add('on'); $('tell').classList.remove('on'); $('door-chat').setAttribute('aria-pressed','true'); $('door-tell').setAttribute('aria-pressed','false'); };
$('readchat').onclick = () => {
  const raw = $('paste').value; if (!raw.trim()) return;
  const turns = raw.split(/\n(?=(?:user|you|me|human|chatgpt|assistant|ai|claude|gemini|copilot)\s*:)/i);
  const human = turns.filter(t => /^(user|you|me|human)\s*:/i.test(t)).map(t => t.replace(/^[a-z]+\s*:/i,'')).join(' ') || raw;
  const ai = turns.filter(t => /^(chatgpt|assistant|ai|claude|gemini|copilot)\s*:/i.test(t)).map(t => t.replace(/^[a-z]+\s*:/i,'')).join(' ');
  $('door-tell').click(); S.arm = 'chat'; S.said.push(human);
  say('me', '[a chat with an AI, ' + raw.split(/\s+/).length + ' words]');
  const isSol = read(human);
  if (ai && !has('decided')) { const rec = sentences(ai).find(s => /\b(should|recommend|best|you can|i suggest|the solution|build|implement)\b/i.test(s)); if (rec) setLine('decided', 'the AI proposed: ' + rec); }
  render(); const n = nextId(isSol); if (n) ask(n);
};
function reqId(){ const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)]; return 'REQ-' + s; }
const RID = reqId();
function body(){
  const tier = (document.querySelector('input[name=tier]:checked') || {value:'1'}).value; const v = id => ($(id).value || '').trim();
  const lines = ['request_id: ' + RID, 'script: __SCRIPT_VERSION__', 'tier: ' + tier, 'deadline: ' + v('deadline'), 'principal_email: ' + v('email'), 'payment: invoice requested', '', 'Collected starting point (my lines):'];
  for (const c of CH) { const l = S.lines[c.id]; lines.push(c.label + ': ' + (l.text || c.default || '(open)') + (l.inferred ? ' [inferred]' : '')); }
  lines.push('', 'In my words, as written:', ...S.said);
  if ($('paste').value.trim()) lines.push('', 'The chat with the AI:', $('paste').value.trim());
  return lines.join('\n');
}
function copy(){ if (navigator.clipboard) navigator.clipboard.writeText(body()).then(() => { $('copy').textContent = 'copied'; }); }
function refresh(){ const b = body(); const tier = (document.querySelector('input[name=tier]:checked') || {value:'1'}).value;
  const href = 'mailto:__MAIL__?subject=' + encodeURIComponent('PROOFBRIDGE T' + tier + ' ' + RID) + '&body=' + encodeURIComponent(b);
  const a = $('send'); if (href.length < 1900) { a.href = href; a.onclick = null; } else { a.href = '#'; a.onclick = e => { e.preventDefault(); copy(); }; } }
$('copy').onclick = copy; $('step2').addEventListener('input', refresh);
say('pb', L.first); render();
</script>
