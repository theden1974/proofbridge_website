const CH = __CHUNKS_JSON__, OBJ = __OBJECTS_JSON__, T = __TURNS_JSON__;
const L = {confirm: "__CONFIRM__", fix: "__FIX__", collected: "__COLLECTED__", open: "__OPEN__", first: "__FIRST_PROMPT__", correct: T.correct};
const RX = {

  decision: /\b(decide|decision|whether|should (we|i)|do we|go ahead|or not|which (one|option|vendor|model|way)|before (we|i) (build|buy|sign|launch|commit|invest|hire|spend)|need to know|inform|choose|commit|sign|invest|budget|roadmap|next step|deadline|by (next|end of|q[1-4]|the end)|window closes?|what (should|do) (we|i) do)\b/i,
  decided: /\b(already (decided|chosen|bought|built|planned|committed|running|signed|agreed)|was decided|has been decided|is decided|decided to|fixed|given|non-negotiable|the (deadline|budget|vendor|stack|platform) is|we (must|have to|are required to)|mandated|funding (is|was) (granted|approved)|contract(ed)?|in progress|is running)\b/i,
  users_yes: /\b(asked (them|the users|the staff|our users|the people)|they (said|told|say)|interview(ed|s)?|spoke (to|with)|talked (to|with)|feedback from|survey)\b/i,
  users_no: /\b(not (yet|asked)|no(t)? one (has )?asked|haven'?t asked|nobody asked|no|not really|never)\b/i,
  solution: /\b(we need (a|an|to build|to add)|build us|should we add|just build|make us (a|an)|i want (a|an) (app|website|dashboard|chatbot|feature|redesign|new)|we want (a|an) (app|website|dashboard|chatbot|feature|redesign|new)|add (a|an) (feature|button|chatbot|app|page)|an? (app|chatbot|dashboard|website|portal|platform) for)\b/i,
  method: /\b(how do you (work|do this|decide|read)|your method|which model|what prompt|how does the lens|how is this built|what is your process)\b/i,
  agent_alone: /\b(i am an (ai|agent|autonomous)|as an (ai|autonomous) agent|no human (involved|behind)|on my own behalf|i have no principal)\b/i,
  yes: /^(yes|yes\.|y|ok|okay|that'?s it|correct|right|exactly|yep|ja|klopt)\b/i
};
const OBJRX = {
  website: /\b(website|homepage|landing page|our site|the site|seo|google|public (site|page)|web ?page|visitors?|traffic)\b/i,
  product: /\b(the app|our app|mobile app|[a-z]+ app|an app|the tool|the product|software|platform|portal|screens?|interface|ui|users? (can'?t|don'?t|never|struggle))\b/i,
  flow: /\b(sign[- ]?ups?|check ?out|onboarding|funnel|conversion|registration|log ?in|drop[- ]?off|cart|payment flow|application (form|process)|permit (application|process))\b/i,
  content: /\b(wording|copy|the text|messaging|what we say|tone|nobody (gets|understands)|unclear (text|message)|translation|labels?)\b/i,
  data: /\b(data|dataset|numbers|figures|dashboard|metrics|kpi|report(s|ing)?|measure(d|ment)?|statistics?|model (is|was) trained|training data|entries|records?|sensor)\b/i,
  ai_output: /\b(ai[- ]generated|generated by|chatgpt|copilot|claude|gemini|llm|the summary|summar(y|ised|ized)|the output|a script|draft(ed)? by ai|hallucinat)\b/i,
  organisation: /\b(team|organisation|organization|department|who owns|ownership|no designer|headcount|workforce|staff|culture|stakeholders?|silo|management|new clients|customers)\b/i,
  process: /\b(how we work|process|hand ?off|workflow|way of working|takes forever|approval (takes|process)|procedure|meetings?|double entry|legacy system)\b/i,
  strategy: /\b(strategy|roadmap|the boss wants|which one|direction|priorit(y|ies|ise|ize)|invest|30 ?%|cut|budget|vision|positioning|age of ai)\b/i
};
const ORDER = ['current','object','decision','who','users_asked'];
const S = { lines: {}, awaiting: null, fixing: null, said: [], arm: 'tell', collectedSaid: false };
for (const c of CH) S.lines[c.id] = {text: null, status: 'open'};
const $ = id => document.getElementById(id);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fill(tpl, q, label){ return tpl.replace('{q}', q || '').replace('{label}', label || ''); }
function sentences(t){ return t.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s => s.length > 2); }
function objectOf(t){ const sc = Object.entries(OBJRX).map(([k,rx]) => [k, (t.match(new RegExp(rx.source,'gi'))||[]).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]); return sc.length ? OBJ.find(o => o.id === sc[0][0]) : null; }
function say(who, html){ const d = document.createElement('div'); d.className = 'msg ' + who; d.innerHTML = html; $('thread').appendChild(d); d.scrollIntoView({block:'nearest'}); }
function setLine(id, text, status, inferred){ S.lines[id] = {text, status, inferred: !!inferred}; }
function required(){ return CH.filter(c => c.required).map(c => c.id); }
function collected(){ return required().every(id => S.lines[id].status === 'ok'); }
// read a text (one turn or a whole chat) into candidate lines; returns which ids got new text
function read(text, opts){
  const ss = sentences(text); const got = [];
  const isSol = RX.solution.test(text);
  if (isSol && !S.lines.decided.text) { const s = ss.find(x => RX.solution.test(x)) || ss[0]; setLine('decided', s, 'pending'); got.push('decided'); }
  for (const [id, rx] of [['who', RX.who], ['current', RX.current], ['decision', RX.decision]]) {
    if (S.lines[id].status === 'ok') continue;
    const s = ss.find(x => rx.test(x) && !(id !== 'decided' && isSol && RX.solution.test(x) && id !== 'who'));
    if (s) { setLine(id, s, 'pending'); got.push(id); }
  }
  if (S.lines.decided.status !== 'ok' && !isSol) { const s = ss.find(x => RX.decided.test(x)); if (s) { setLine('decided', s, 'pending'); got.push('decided'); } }
  if (S.lines.object.status !== 'ok') { const o = objectOf(S.said.join(' ') + ' ' + text); if (o) { setLine('object', o.label, 'pending', true); got.push('object'); } }
  if (S.lines.users_asked.status !== 'ok') { const s = ss.find(x => RX.users_yes.test(x)); if (s) { setLine('users_asked', s, 'pending'); got.push('users_asked'); } }
  return {got, isSol};
}
function nextQuestion(isSol){
  const order = isSol ? ORDER : ['object','decision','who','current','users_asked'];
  const anyPending = required().some(id => S.lines[id].status === 'pending');
  for (const id of order) { const l = S.lines[id]; const c = CH.find(x => x.id === id); if (l.status === 'open' && c.required) return id; }
  if (!anyPending && S.lines.users_asked.status === 'open') return 'users_asked';
  return null;
}
function render(){
  $('lines').innerHTML = CH.map(c => { const l = S.lines[c.id]; const cls = (l.status === 'ok' ? 'ok' : l.status === 'pending' ? 'pending' : '') + (c.required ? '' : ' opt') + (l.inferred ? ' inf' : '');
    const text = l.text || (c.required ? '' : c.default);
    const ctl = l.status === 'pending' ? '<div class="ctl"><button type="button" data-ok="' + c.id + '">' + L.confirm + '</button><button type="button" data-fix="' + c.id + '">' + L.fix + '</button></div>' : '';
    return '<li class="' + cls + '"><b>' + esc(c.label) + '</b>' + (text ? '<q class="' + (l.text ? (l.inferred ? 'inf' : '') : 'inf') + '">' + esc(text) + '</q>' : '') + ctl + '</li>'; }).join('');
  const ok = collected(); $('state').textContent = ok ? L.collected : L.open; $('step2').classList.toggle('on', ok);
  if (ok && !S.collectedSaid) { S.collectedSaid = true; say('pb', esc(T.collected)); }
  refresh();
}
function ask(id){ if (!id) return; S.awaiting = id; const last = S.said[S.said.length-1] || ''; const q = sentences(last).slice(-1)[0] || last; say('pb', esc(fill(T.ask[id], q.length > 90 ? q.slice(0, 90) + '…' : q))); }
function turn(text){
  text = text.trim(); if (!text) return; S.said.push(text); say('me', esc(text));
  if (RX.method.test(text)) { say('pb', esc(T.method)); render(); return; }
  if (RX.agent_alone.test(text)) { say('pb', esc(T.agent_alone)); render(); return; }
  if (S.fixing) { setLine(S.fixing, text, 'ok'); S.fixing = null; render(); if (!S.awaiting) { const n = nextQuestion(false); if (n) ask(n); } return; }
  if (S.awaiting === 'users_asked') { if (RX.users_no.test(text) && !RX.users_yes.test(text)) setLine('users_asked', CH.find(c=>c.id==='users_asked').default, 'ok', true); else setLine('users_asked', text, 'ok'); S.awaiting = null; say('pb', esc(T.noted)); render(); const n = nextQuestion(false); if (n) ask(n); return; }
  if (S.awaiting && RX.yes.test(text) && S.lines[S.awaiting].status === 'pending') { setLine(S.awaiting, S.lines[S.awaiting].text, 'ok'); S.awaiting = null; render(); const n = nextQuestion(false); if (n) ask(n); return; }
  const {got, isSol} = read(text);
  if (S.awaiting && !got.includes(S.awaiting)) { setLine(S.awaiting, text, 'pending'); if (!got.includes(S.awaiting)) got.push(S.awaiting); }
  for (const id of got) { const l = S.lines[id]; const c = CH.find(x => x.id === id);
    if (id === 'object') say('pb', esc(fill(T.heard_object, '', l.text)));
    else if (id === 'decided' && isSol) say('pb', esc(fill(T.solution, l.text)));
    else say('pb', esc(fill(T.heard, l.text.length > 110 ? l.text.slice(0,110) + '…' : l.text, c.label.toLowerCase()))); }
  S.awaiting = null; render();
  { const n = nextQuestion(isSol); if (n === 'current' && isSol) { S.awaiting = 'current'; } else if (n) ask(n); }
}
$('compose').addEventListener('submit', () => { const t = $('say').value; $('say').value = ''; turn(t); $('say').focus(); });
$('say').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('compose').requestSubmit(); } });
$('lines').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ok) { setLine(b.dataset.ok, S.lines[b.dataset.ok].text, 'ok', S.lines[b.dataset.ok].inferred); if (S.awaiting === b.dataset.ok) S.awaiting = null; render(); if (!S.awaiting) { const n = nextQuestion(false); if (n) ask(n); } }
  if (b.dataset.fix) { S.fixing = b.dataset.fix; say('pb', esc(L.correct)); $('say').focus(); } });
$('door-tell').onclick = () => { S.arm = 'tell'; $('tell').classList.add('on'); $('chat').classList.remove('on'); $('door-tell').setAttribute('aria-pressed','true'); $('door-chat').setAttribute('aria-pressed','false'); };
$('door-chat').onclick = () => { S.arm = 'chat'; $('chat').classList.add('on'); $('tell').classList.remove('on'); $('door-chat').setAttribute('aria-pressed','true'); $('door-tell').setAttribute('aria-pressed','false'); };
$('readchat').onclick = () => {
  const raw = $('paste').value; if (!raw.trim()) return;
  // keep the human's turns for who/current/decision; the AI's turns for "already decided" (what was accepted); labels tolerated: User/You/Me/Human vs ChatGPT/Assistant/AI/Claude/Gemini/Copilot
  const turns = raw.split(/\n(?=(?:user|you|me|human|chatgpt|assistant|ai|claude|gemini|copilot)\s*:)/i);
  const human = turns.filter(t => /^(user|you|me|human)\s*:/i.test(t)).map(t => t.replace(/^[a-z]+\s*:/i,'')).join(' ') || raw;
  const ai = turns.filter(t => /^(chatgpt|assistant|ai|claude|gemini|copilot)\s*:/i.test(t)).map(t => t.replace(/^[a-z]+\s*:/i,'')).join(' ');
  S.arm = 'tell'; $('door-tell').click(); S.said.push(human);
  say('me', esc('[a chat with an AI, ' + raw.split(/\s+/).length + ' words]'));
  const {got, isSol} = read(human);
  if (ai && !S.lines.decided.text) { const rec = sentences(ai).find(s => /\b(should|recommend|best|you can|i suggest|the solution|build|implement)\b/i.test(s)); if (rec) { setLine('decided', 'the AI proposed: ' + rec, 'pending'); got.push('decided'); } }
  for (const id of got) { const l = S.lines[id]; const c = CH.find(x => x.id === id); say('pb', esc(id === 'object' ? fill(T.heard_object, '', l.text) : fill(T.heard, l.text.length > 110 ? l.text.slice(0,110) + '…' : l.text, c.label.toLowerCase()))); }
  render(); const n = nextQuestion(isSol); if (n) ask(n);
};
function reqId(){ const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)]; return 'REQ-' + s; }
const RID = reqId();
function body(){
  const tier = (document.querySelector('input[name=tier]:checked') || {value:'1'}).value; const v = id => ($(id).value || '').trim();
  const lines = ['request_id: ' + RID, 'script: __SCRIPT_VERSION__', 'tier: ' + tier, 'deadline: ' + v('deadline'), 'principal_email: ' + v('email'), 'payment: invoice requested', '', 'Collected starting point (my lines, confirmed):'];
  for (const c of CH) { const l = S.lines[c.id]; lines.push(c.label + ': ' + (l.text || c.default || '(open)') + (l.status === 'ok' ? '' : ' [not confirmed]')); }

  if (S.arm === 'chat' || $('paste').value.trim()) lines.push('', 'The chat with the AI:', $('paste').value.trim());

}
function copy(){ if (navigator.clipboard) navigator.clipboard.writeText(body()).then(() => { $('copy').textContent = 'copied'; }); }
function refresh(){ const b = body(); const tier = (document.querySelector('input[name=tier]:checked') || {value:'1'}).value;
