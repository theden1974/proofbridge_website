<div class="wrap">

<script>
// v8: side kick. One pattern at most (presented / underneath), built from two of the asker's own sentences, asked as a guess; the answer travels in the mail. Otherwise the page only takes the story and sends.
// v7: empty state first. Two prompts in the asker's words; the right side appears only when a sentence is read, and shows only what was read. No notes, no hints, no promises. A floor only: something happens, not a method question, not an agent alone.
// Script version __SCRIPT_VERSION__. Texts from src/ask.json.
const F = __FLOOR_JSON__; const ASKQ = { plan: '__SK_ASK_PLAN__', people: '__SK_ASK_PEOPLE__', effect: '__SK_ASK_EFFECT__' };
const GRX = {
  who: /\b(i am|i'm|we are|we're|my (team|client|boss|manager|director|board|company|organisation|organization|shop|practice|firm)|our (team|client|board|company|users?|customers?|staff|employees?|clients?)|the (board|director|ceo|cto|manager|management|founder|owner|municipality|authority|hospital|school|agency|minister|council|client|customer)|owner of|lead at|work(s|ing)? (at|for)|advis[eo]r|project lead|product owner|nurse|doctor|lawyer|architect|developer|designer|researcher|recruiter|consultant|patients?|elderly|residents?|applicants?|employees?|staff|users?|(she|he|they) decides?|decided|mandate|funding)\b/i,
  happens: /\b(doesn'?t|don'?t|does not|do not|can'?t|cannot|won'?t|isn'?t|aren'?t|wasn'?t|not (sure|tracking|working|getting|converting|enough|clear|happening|used|using)|wrong|fail(s|ed|ing)?|complain(s|ed|t|ts)?|slow|unclear|stuck|nobody|no one|drop(ped|s)? ?(off)?|abandon|churn|late|delays?|double (entry|work)|twice|errors?|mistakes?|hallucinat|unreliable|outdated|out of date|incomplete|inaccurate|missing|problems?|issues?|decline|declin(ed|ing)|down|lost|losing|less|fewer|worse|struggl(e|es|ing)|hard(er)? to|difficult|no longer|too (long|many|few|slow)|only \d|\d+ ?%|\d+ (users|people|clients|hours|days|weeks|minutes|calls|complaints|visitors|leads)|call(s|ed)? (us|instead)|since (last|the)|last (week|month|year|quarter))/i,
  asked: /\b(we need (a|an|to build|to add)|i need (a|an|to build)|build us|should we add|just build|make us (a|an)|(i|we) want (a|an) (app|website|dashboard|chatbot|feature|redesign|new)|add (a|an) (feature|button|chatbot|app|page)|an? (app|chatbot|dashboard|website|portal|platform) for|build (a|the) (website|app)|was (already )?decided|already (decided|chosen|bought|planned)|the plan is|asked (me|us) to|wants? (to|a|an) (replace|build|buy|add|introduce|new|chatbot|app|tool|website|redesign)|replace (the|our) [a-z ]+ with|a new (tool|app|system|website|platform)|asked for quotes|quotes? (for|from)|proposes?|proposal)\b/i,
  assumed: /\b(assume[sd]?|assumption|we (think|believe|expect|hope)|take[sn]? for granted|obviously|of course|everyone (knows|says|thinks)|supposed to|should work|will (use|work|fix|solve))\b/i,
  differently: /\b(decide|decision|whether|should (we|i)|do we|go ahead|or not|which (one|option|vendor|model|way)|before (we|i) (build|buy|sign|launch|commit|invest|hire|spend)|need to know|choose|commit|invest|budget|roadmap|next step|deadline|by (next|end of|q[1-4]|the end)|window closes?|what (should|do) (we|i) do|stop|instead|rather)\b/i
};
function sentences(t){ return t.replace(/\s+/g,' ').split(/(?<=[.!?;])\s+|,?\s+(?=but\b|however\b|while\b|although\b)/i).map(x=>x.trim().replace(/^(but|however|while|although)\s+/i,'')).filter(x => x.length > 2); }
const MUP = __MUP_JSON__;
const M = { read: {}, own: {}, open: {} };
const MRX = {
  mandate: /\b(i decide|we decide|(she|he|they) decides?|decides?|decided|mandate|signs? off|approv(e|es|ed)|budget|i'?m the (owner|ceo|founder|director|manager|boss)|i am the (owner|ceo|founder|director|manager|boss)|owner of|ceo|cto|founder|director|the board|management|my (boss|manager|director|partner|business partner)|business partner|partner wants|wants to (replace|build|buy|add|introduce)|asked me to|my client|the client)\b/i,
  pain: /\b(patients?|clients?|customers?|users?|staff|employees?|receptionist|assistant|team|colleagues|elderly|residents?|applicants?|students?|members?|visitors?|buyers?|candidates?|people)\b/i,
  hurt2: /\b(spends?|waits?|waiting|on hold|on the phone|only one in|one in (two|three|four|five|ten)|most of the (morning|day|week)|loses?|losing|lost)\b/i
};
function readMup(text){
  const ss = sentences(text); const used = new Set(); const out = {};
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  const hurt = ss.filter(x => GRX.happens.test(x));
  if (words >= 15) { out.problem = hurt[0] || ss[0]; if (out.problem) used.add(out.problem); }
  const m = ss.filter(x => MRX.mandate.test(x)); out.mandate = m.find(x => !used.has(x)) || m[0]; if (out.mandate) used.add(out.mandate);
  const pg = ss.filter(x => MRX.pain.test(x) && !GRX.asked.test(x)); const ph = pg.filter(x => GRX.happens.test(x) || MRX.hurt2.test(x)); out.pain = ph.find(x => !used.has(x)) || ph[0] || pg.find(x => !used.has(x)) || null;
  return out;
}
function drawMup(){
  $('mup').innerHTML = MUP.items.map(it => { const own = M.own[it.id], read = M.read[it.id]; const ok = !!(own || read);
    const q = own ? '<q class="own">' + esc(own) + '</q>' : read ? '<q class="read">' + esc(read.length > 150 ? read.slice(0,150) + '…' : read) + '</q>' : '';
    const edit = M.open[it.id] ? '<label class="vh" for="mup-' + it.id + '">' + esc(it.label) + '</label><textarea id="mup-' + it.id + '" data-id="' + it.id + '">' + esc(own || '') + '</textarea>'
      : '<button type="button" class="linkbtn" data-open="' + it.id + '">' + (ok ? MUP.change : MUP.add) + '</button>';
    return '<li class="' + (ok ? 'ok' : '') + '"><b>' + esc(it.label) + '</b>' + q + edit + '</li>'; }).join('');
}
function sidekick(text){ const r = readMup(text); const changed = JSON.stringify(r) !== JSON.stringify(M.read); M.read = r; if (changed && !(document.activeElement && document.activeElement.closest('#mup'))) drawMup(); return M; }
function bindSK(){
  $('mup').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (!b) return; const id = b.dataset.open; M.open[id] = true; drawMup(); const t = $('mup-' + id); if (t) t.focus(); });
  $('mup').addEventListener('input', e => { const t = e.target.closest('textarea[data-id]'); if (!t) return; M.own[t.dataset.id] = t.value.trim(); refresh(); });
  $('mup').addEventListener('focusout', e => { const t = e.target.closest('textarea[data-id]'); if (!t) return; if (!t.value.trim()) delete M.own[t.dataset.id]; M.open[t.dataset.id] = false; setTimeout(drawMup, 0); });
  drawMup(); }
function announce(msg){ const r = $('announce'); r.textContent = ''; setTimeout(() => { r.textContent = msg; }, 50); }
function esc(x){ return String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const RX = {
  wish: /\b(i want|we want|would like|wish|hope|goal|instead|rather|ideally|decide|whether|need to (know|decide|choose)|the question is|should (we|i)|what (should|do) (we|i) do)\b/i,
  happens: /\b(is|are|was|were|do|does|did|has|have|had|can'?t|cannot|doesn'?t|don'?t|not|no|never|always|every|since|last|now|when|because|but|only|\d)\b/i,
  method: /\b(how do you (work|do this|decide|read)|your method|which model|what prompt|how does the lens|how is this built|what is your process)\b/i,
  agent_alone: /\b(i am an (ai|agent|autonomous)|as an (ai|autonomous) agent|no human (involved|behind)|on my own behalf|i have no principal)\b/i
};
const $ = id => document.getElementById(id);
let arm = 'tell';
function words(t){ return t.trim().split(/\s+/).filter(Boolean).length; }
function floor(){
  const story = arm === 'tell' ? $('story').value : $('paste').value; const all = story;
  let msg = null, ok = false;
  if (RX.method.test(all)) msg = F.method;
  else if (RX.agent_alone.test(all)) msg = F.agent_alone;
  else if (words(story) < 20 || !RX.happens.test(story)) msg = F.short;
  else ok = true;
  const f = $('floor'); f.textContent = ok ? '' : (msg || ''); f.hidden = !f.textContent;
  const was = $('step2').classList.contains('on'); $('step2').classList.toggle('on', ok); if (ok && !was) announce('__ANNOUNCE_SEND__'); refresh();
}
// side kick: on a pause (1500 ms without typing) or when the box is left; never per keystroke
let pauseT = null;
function storyText(){ return arm === 'tell' ? $('story').value : $('paste').value; }
function schedule(){ clearTimeout(pauseT); pauseT = setTimeout(() => { const t = storyText().trim(); if (/[.!?]$/.test(t)) sidekick(t); }, 1500); }
['story','paste'].forEach(id => { $(id).addEventListener('input', schedule); $(id).addEventListener('blur', () => { clearTimeout(pauseT); sidekick(storyText()); }); });
$('door-tell').onclick = () => { arm = 'tell'; $('tell').classList.add('on'); $('chat').classList.remove('on'); floor(); $('story').focus(); };
$('door-chat').onclick = () => { arm = 'chat'; $('chat').classList.add('on'); $('tell').classList.remove('on'); floor(); $('paste').focus(); };
function reqId(){ const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)]; return 'REQ-' + s; }
const RID = reqId();
function body(){
  const v = id => ($(id).value || '').trim();
  const lines = ['request_id: ' + RID, 'script: __SCRIPT_VERSION__', 'door: ' + arm, 'principal_email: ' + v('email'), 'payment: none (test phase)', ''];
  if (arm === 'tell') { lines.push('What happens:', v('story')); }
  else lines.push('The chat with the AI:', v('paste'));
  lines.push('', 'What the lens needs (MUP), as read on the page and as written by the asker:');
  for (const it of MUP.items) lines.push(it.label + ': ' + (M.own[it.id] ? 'own: ' + M.own[it.id] + (M.read[it.id] ? ' | read was: ' + M.read[it.id] : '') : M.read[it.id] ? 'read: ' + M.read[it.id] : '(empty)'));
  return lines.join('\n');
}
function copy(){ if (navigator.clipboard) navigator.clipboard.writeText(body()).then(() => { $('copy').textContent = 'copied'; }); }
function refresh(){ const b = body();
  const href = 'mailto:__MAIL__?subject=' + encodeURIComponent('PROOFBRIDGE ' + RID) + '&body=' + encodeURIComponent(b);
  const a = $('send');
  if (ENDPOINT) { a.href = '#'; a.onclick = sendForm; return; }
  if (href.length < 1900) { a.href = href; a.onclick = null; a.textContent = '__SEND__'; }
  else { a.href = 'mailto:__MAIL__?subject=' + encodeURIComponent('PROOFBRIDGE ' + RID); a.textContent = '__SEND_LONG__';
    a.onclick = () => { copy(); const n = $('step2').querySelector('.actions .status'); if (n) n.innerHTML = '__COPIED_NOTE__ <a href="mailto:__MAIL__">__MAIL__</a>'; }; } }
const ENDPOINT = '__SEND_ENDPOINT__';
async function sendForm(e){ e.preventDefault(); const a = $('send'); if (a.dataset.busy) return;
  if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(($('email').value || '').trim())) { $('email-check').textContent = '__EMAIL_REQUIRED__'; $('email-check').hidden = false; $('email').focus(); announce('__EMAIL_REQUIRED__'); return; } a.dataset.busy = '1'; a.textContent = '…';
  try { const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ request_id: RID, email: ($('email').value || '').trim(), website: $('website').value, body: body() }) });
    const j = await r.json().catch(() => ({})); if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    $('step2').querySelector('.actions').innerHTML = '<p class="sent" tabindex="-1" id="sent"><b>__SENT_LABEL__ ' + RID + '</b><span>__SENT_AFTER__</span></p>'; $('sent').focus(); announce('__SENT_LABEL__ ' + RID); try { sessionStorage.removeItem('pb-ask-draft'); } catch (e) {}
  } catch (err) { a.textContent = '__SEND__'; delete a.dataset.busy; const n = $('step2').querySelector('.actions .status'); if (n) n.innerHTML = '__SEND_FAIL__ <a href="mailto:__MAIL__">__MAIL__</a>'; } }
$('email').addEventListener('input', () => { const v = $('email').value.trim(); if (/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) $('email-check').hidden = true; });
$('email').addEventListener('blur', () => { const v = $('email').value.trim(); $('email-check').hidden = !v || /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v); });
// design for interruption: the draft survives a reload in this tab, nowhere else
try { const d = JSON.parse(sessionStorage.getItem('pb-ask-draft') || 'null'); if (d && d.story) { $('story').value = d.story; $('email').value = d.email || ''; announce('__DRAFT_RESTORED__'); } } catch (e) {}
document.addEventListener('input', () => { try { sessionStorage.setItem('pb-ask-draft', JSON.stringify({ story: $('story').value, email: $('email').value })); } catch (e) {} });
$('copy').onclick = copy; bindSK(); document.addEventListener('input', floor); floor();
</script>
