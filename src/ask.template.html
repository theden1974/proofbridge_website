<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · proofbridge</title>
<meta name="description" content="__LEAD__">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://proofbridge.nl/ask/">
<script type="application/ld+json">__LD__</script>
__CSS__
<style>
  .alt { margin: 0.6rem 0 0; font-size: var(--s-1); }
  .link { font: inherit; font-size: var(--s-1); background: none; border: 0; padding: 0; color: var(--grey); text-decoration: underline; cursor: pointer; }
  .guide li.hint::before { content: "○"; color: var(--accent); }
  .two { display: grid; grid-template-columns: 3fr 2fr; gap: 2.5rem; margin-top: 1.6rem; align-items: start; }
  .door { display: none; } .door.on { display: block; }
  .q { font-size: var(--s1, 1.25rem); font-weight: 500; margin: 0 0 0.5rem; }
  .q small { display: block; font-weight: 400; color: var(--grey); font-size: var(--s-1); margin-top: 0.2rem; }
  textarea, input { font: inherit; width: 100%; padding: 0.9rem 1rem; border: 1px solid var(--line); border-radius: 0.8rem; background: #fff; color: var(--ink); }
  textarea { resize: vertical; min-height: 11rem; line-height: 1.5; }
  .second { margin-top: 1.4rem; display: none; } .second.on { display: block; } .second textarea { min-height: 5rem; }
  .btn { font: inherit; font-family: var(--mono); font-size: var(--s-1); text-transform: uppercase; letter-spacing: 0.06em; background: var(--ink); color: var(--paper); border: 0; border-radius: 2rem; padding: 0.7rem 1.1rem; cursor: pointer; text-decoration: none; display: inline-block; }
  .side { padding: 1.1rem 1.2rem; border: 1px solid var(--line); border-radius: 1rem; }
  .side ol { padding-left: 1.2rem; margin: 0.6rem 0 0; display: grid; gap: 0.45rem; } .side li { font-size: var(--s-1); }
  .side .label + ol { margin-top: 0.6rem; }
  .guide { list-style: none; padding: 0; margin: 0.8rem 0 0.4rem; display: grid; gap: 0.8rem; }
  .guide li { padding-left: 1.3rem; position: relative; }
  .guide li::before { content: ""; position: absolute; left: 0; color: var(--grey); }
  .guide li.ok::before { content: "●"; color: var(--accent); }
  .guide li b { display: block; font-weight: 500; font-size: var(--s-1); }
  .guide li q { display: block; font-size: var(--s-1); margin-top: 0.15rem; quotes: "“" "”"; }
  .guide li span { display: block; font-size: var(--s-1); color: var(--grey); margin-top: 0.15rem; font-style: italic; } .side .label { display: block; margin-top: 1.1rem; } .side .label:first-child { margin-top: 0; }
  .floor { margin-top: 1.2rem; font-weight: 500; } .floor.off { color: var(--grey); font-weight: 400; }
  .step2 { margin-top: 1.6rem; display: none; } .step2.on { display: block; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-width: 60ch; }
  .opts { display: grid; gap: 0.6rem; margin-top: 0.5rem; max-width: 60ch; }
  .opts label { display: flex; gap: 0.7rem; align-items: baseline; padding: 0.7rem 0.8rem; border: 1px solid var(--line); border-radius: 0.6rem; cursor: pointer; }
  .opts input { width: auto; margin: 0; }
  fieldset { border: 0; padding: 0; margin: 1rem 0 0; } legend b { font-weight: 500; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; margin-top: 1.2rem; }
  .status { color: var(--grey); font-size: var(--s-1); }
  label b { display: block; font-weight: 500; }
  @media (max-width: 860px) { .two, .row { grid-template-columns: 1fr; } }
  @media (prefers-color-scheme: dark) { textarea, input { background: #1a191e; } .btn { background: var(--ink); color: #111014; } .doors button[aria-pressed="true"] { background: var(--ink); color: #111014; } }
  [hidden] { display: none !important; }
  .pair { margin: 0.7rem 0 0; font-size: var(--s-1); } .pair b { display: block; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; font-size: 0.7rem; color: var(--grey); font-weight: 400; } .pair q { quotes: "“" "”"; }
  .ctl { margin-top: 0.9rem; display: flex; gap: 0.6rem; } .ctl button { font: inherit; font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; background: transparent; border: 1px solid var(--line); border-radius: 2rem; padding: 0.3rem 0.7rem; cursor: pointer; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
<header class="bar">
  <a class="label" href="/">proofbridge</a>
  <span class="label">__STATUS__</span>
</header>
<section class="intro" aria-labelledby="h1">
  <span class="label">↳ ask</span>
  <h1 id="h1">__TITLE__</h1>
  <p>__LEAD__</p>
</section>


<div class="two">
  <div>
    <div class="door on" id="tell">
      <label for="story"><p class="q">__PROMPT1__</p>
      <textarea id="story"></textarea></label>
      <p class="alt"><button type="button" class="link" id="door-chat">__DOOR_CHAT__</button></p>
      <div class="second" id="second">
        <label for="wish"><p class="q">__PROMPT2__</p>
        <textarea id="wish"></textarea></label>
      </div>
    </div>
    <div class="door" id="chat">
      <label for="paste"><p class="q">__CHAT_LEAD__</p>
      <textarea id="paste" style="min-height:14rem"></textarea></label>
      <p class="alt"><button type="button" class="link" id="door-tell">__DOOR_BACK__</button></p>
    </div>
    <p class="floor off" id="floor" hidden></p>
    <section class="step2" id="step2" aria-label="Send">
      <div class="row">
        <label><b>__EMAIL_LABEL__</b><input type="email" id="email"></label>
      </div>
      <div class="actions">
        <a class="btn" id="send" href="#">__SEND__</a>
        <button class="btn" type="button" id="copy">__COPY__</button>
        <span class="status">__SEND_NOTE__ <a href="mailto:__MAIL__">__MAIL__</a></span>
      </div>
    </section>
  </div>
  <aside class="side" id="side" aria-live="polite" hidden>
    <p class="q" style="font-size:1rem">__SK_INTRO__</p>
    <p class="pair"><b>__SK_PRESENTED__</b><q id="sk-p"></q></p>
    <p class="pair"><b>__SK_UNDERNEATH__</b><q id="sk-u"></q></p>
    <div class="ctl" id="sk-ctl"><button type="button" id="sk-yes">__SK_YES__</button><button type="button" id="sk-no">__SK_NO__</button></div>
    <p class="status" id="sk-thanks" hidden></p>
  </aside>
</div>

<footer>
  <span class="label">↳ connect</span>
  <a href="mailto:__MAIL__">__MAIL__</a>
  <p class="agents label">↳ __CONTRACT_LINE__</p>
</footer>
</div>
<script>
// v8: side kick. One pattern at most (presented / underneath), built from two of the asker's own sentences, asked as a guess; the answer travels in the mail. Otherwise the page only takes the story and sends.
// v7: empty state first. Two prompts in the asker's words; the right side appears only when a sentence is read, and shows only what was read. No notes, no hints, no promises. A floor only: something happens, not a method question, not an agent alone.
// Script version __SCRIPT_VERSION__. Texts from src/ask.json.
const F = __FLOOR_JSON__;
const GRX = {
  who: /\b(i am|i'm|we are|we're|my (team|client|boss|manager|director|board|company|organisation|organization|shop|practice|firm)|our (team|client|board|company|users?|customers?|staff|employees?|clients?)|the (board|director|ceo|cto|manager|management|founder|owner|municipality|authority|hospital|school|agency|minister|council|client|customer)|owner of|lead at|work(s|ing)? (at|for)|advis[eo]r|project lead|product owner|nurse|doctor|lawyer|architect|developer|designer|researcher|recruiter|consultant|patients?|elderly|residents?|applicants?|employees?|staff|users?|(she|he|they) decides?|decided|mandate|funding)\b/i,
  happens: /\b(doesn'?t|don'?t|does not|do not|can'?t|cannot|won'?t|isn'?t|aren'?t|wasn'?t|not (sure|tracking|working|getting|converting|enough|clear|happening|used|using)|wrong|fail(s|ed|ing)?|complain(s|ed|t|ts)?|slow|unclear|stuck|nobody|no one|drop(ped|s)? ?(off)?|abandon|churn|late|delays?|double (entry|work)|twice|errors?|mistakes?|hallucinat|unreliable|outdated|out of date|incomplete|inaccurate|missing|problems?|issues?|decline|declin(ed|ing)|down|lost|losing|less|fewer|worse|struggl(e|es|ing)|hard(er)? to|difficult|no longer|too (long|many|few|slow)|only \d|\d+ ?%|\d+ (users|people|clients|hours|days|weeks|minutes|calls|complaints|visitors|leads)|call(s|ed)? (us|instead)|since (last|the)|last (week|month|year|quarter))/i,
  asked: /\b(we need (a|an|to build|to add)|i need (a|an|to build)|build us|should we add|just build|make us (a|an)|(i|we) want (a|an) (app|website|dashboard|chatbot|feature|redesign|new)|add (a|an) (feature|button|chatbot|app|page)|an? (app|chatbot|dashboard|website|portal|platform) for|build (a|the) (website|app)|was (already )?decided|already (decided|chosen|bought|planned)|the plan is|asked (me|us) to|wants? (to|a|an) (replace|build|buy|add|introduce|new|chatbot|app|tool|website|redesign)|replace (the|our) [a-z ]+ with|a new (tool|app|system|website|platform)|asked for quotes|quotes? (for|from)|proposes?|proposal)\b/i,
  assumed: /\b(assume[sd]?|assumption|we (think|believe|expect|hope)|take[sn]? for granted|obviously|of course|everyone (knows|says|thinks)|supposed to|should work|will (use|work|fix|solve))\b/i,
  differently: /\b(decide|decision|whether|should (we|i)|do we|go ahead|or not|which (one|option|vendor|model|way)|before (we|i) (build|buy|sign|launch|commit|invest|hire|spend)|need to know|choose|commit|invest|budget|roadmap|next step|deadline|by (next|end of|q[1-4]|the end)|window closes?|what (should|do) (we|i) do|stop|instead|rather)\b/i
};
function sentences(t){ return t.replace(/\s+/g,' ').split(/(?<=[.!?;])\s+|,?\s+(?=but\b|however\b|while\b|although\b)/i).map(x=>x.trim().replace(/^(but|however|while|although)\s+/i,'')).filter(x => x.length > 2); }
const SK = { fired: null, answer: null };
const DORMANT = /\b(nobody (has )?asked|no one (has )?asked|haven'?t asked|not asked|never asked|without asking)\b/i;
function sidekick(text){
  const ss = sentences(text);
  const presented = ss.find(x => GRX.asked.test(x));
  const underneath = presented ? (ss.find(x => x !== presented && (GRX.assumed.test(x) || DORMANT.test(x))) || ss.find(x => x !== presented && !GRX.asked.test(x) && GRX.happens.test(x))) : null;
  const key = presented && underneath ? presented + '|' + underneath : null;
  if (key !== (SK.fired && SK.fired.key)) { SK.fired = key ? {key, presented, underneath} : null; SK.answer = null; $('sk-thanks').hidden = true; $('sk-ctl').hidden = false; }
  if (SK.fired) { $('sk-p').textContent = presented; $('sk-u').textContent = underneath; }
  $('side').hidden = !SK.fired;
  return SK;
}
function bindSK(){ $('sk-yes').onclick = () => { SK.answer = 'yes'; $('sk-thanks').textContent = '__SK_THANKS_YES__'; $('sk-thanks').hidden = false; $('sk-ctl').hidden = true; refresh(); };
$('sk-no').onclick = () => { SK.answer = 'no'; $('sk-thanks').textContent = '__SK_THANKS_NO__'; $('sk-thanks').hidden = false; $('sk-ctl').hidden = true; refresh(); }; }
function esc(x){ return String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const RX = {
  wish: /\b(i want|we want|would like|wish|hope|goal|instead|rather|ideally|decide|whether|need to (know|decide|choose)|the question is|should (we|i)|what (should|do) (we|i) do)\b/i,
  happens: /\b(is|are|was|were|do|does|did|has|have|had|can'?t|cannot|doesn'?t|don'?t|not|no|never|always|every|since|last|now|when|because|but|only|\d)\b/i,
  method: /\b(how do you (work|do this|decide|read)|your method|which model|what prompt|how does the lens|how is this built|what is your process)\b/i,
  agent_alone: /\b(i am an (ai|agent|autonomous)|as an (ai|autonomous) agent|no human (involved|behind)|on my own behalf|i have no principal)\b/i
};
const $ = id => document.getElementById(id);
let arm = 'tell';
function words(t){ return t.trim().split(/\s+/).filter(Boolean).length; }
function floor(){
  const story = arm === 'tell' ? $('story').value : $('paste').value; const wish = $('wish').value; const all = story + ' ' + wish;
  sidekick(all);
  let msg = null, ok = false;
  if (RX.method.test(all)) msg = F.method;
  else if (RX.agent_alone.test(all)) msg = F.agent_alone;
  else if (words(story) < 20 || !RX.happens.test(story)) msg = F.short;
  else ok = true;
  $('second').classList.toggle('on', arm === 'tell' && words(story) >= 20 && !RX.wish.test(story));
  const f = $('floor'); f.textContent = ok ? '' : (msg || ''); f.hidden = !f.textContent;
  $('step2').classList.toggle('on', ok); refresh();
}
$('door-tell').onclick = () => { arm = 'tell'; $('tell').classList.add('on'); $('chat').classList.remove('on'); floor(); $('story').focus(); };
$('door-chat').onclick = () => { arm = 'chat'; $('chat').classList.add('on'); $('tell').classList.remove('on'); floor(); $('paste').focus(); };
function reqId(){ const a = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)]; return 'REQ-' + s; }
const RID = reqId();
function body(){
  const v = id => ($(id).value || '').trim();
  const lines = ['request_id: ' + RID, 'script: __SCRIPT_VERSION__', 'door: ' + arm, 'principal_email: ' + v('email'), 'payment: none (test phase)', ''];
  if (arm === 'tell') { lines.push('What happens:', v('story')); if (v('wish')) lines.push('', 'What I would like to be different:', v('wish')); }
  else lines.push('The chat with the AI:', v('paste'));
  if (SK.fired) { lines.push('', 'Side kick (pattern: presented / underneath): ' + (SK.answer || 'unanswered')); lines.push('Presented: ' + SK.fired.presented); lines.push('Underneath: ' + SK.fired.underneath); }
  return lines.join('\n');
}
function copy(){ if (navigator.clipboard) navigator.clipboard.writeText(body()).then(() => { $('copy').textContent = 'copied'; }); }
function refresh(){ const b = body();
  const href = 'mailto:__MAIL__?subject=' + encodeURIComponent('PROOFBRIDGE TEST ' + RID) + '&body=' + encodeURIComponent(b);
  const a = $('send'); if (href.length < 1900) { a.href = href; a.onclick = null; } else { a.href = '#'; a.onclick = e => { e.preventDefault(); copy(); }; } }
$('copy').onclick = copy; bindSK(); document.addEventListener('input', floor); floor();
</script>
</body>
</html>
