<style>

    --s-1: clamp(0.8rem, 0.76rem + 0.2vw, 0.9rem);
    --s0: clamp(1rem, 0.95rem + 0.25vw, 1.15rem);
    --s1: clamp(1.25rem, 1.19rem + 0.31vw, 1.5rem);
    --s3: clamp(1.95rem, 1.6rem + 1.2vw, 2.6rem);

  }

  body { font-family: "DM Sans", system-ui, -apple-system, Helvetica, sans-serif; font-weight: 300; font-size: var(--s0); line-height: 1.55; }

  .bar .label { margin: 0; }
  .bar a { color: var(--ink); text-decoration: none; }
  .intro { padding: clamp(3rem, 10vh, 7rem) 0 clamp(2.5rem, 7vh, 5rem); border-bottom: 1px solid var(--line); }
  .intro h1 { font-weight: 500; font-size: var(--s5); line-height: 1.08; letter-spacing: -0.02em; max-width: 22ch; }
  .intro p { font-size: var(--s1); color: var(--grey); max-width: 38ch; margin-top: 1.4rem; }
  .vp .proof { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--line); color: var(--grey); font-size: var(--s-1); line-height: 1.5; }
  .vp .proof .label { margin-bottom: 0.4rem; }
  .note { font-family: var(--mono); font-size: var(--s-1); color: var(--grey); letter-spacing: 0; text-transform: none; font-weight: 300; }
  .att h2 { font-weight: 500; font-size: var(--s3); line-height: 1.1; }
  .story { padding: clamp(2.5rem, 7vh, 5rem) 0; border-bottom: 1px solid var(--line); display: grid; gap: 1.6rem; max-width: 42ch; }
  .story p { font-size: var(--s1); line-height: 1.45; } .story p::first-line { font-weight: 500; } .story .who { color: var(--grey); }
  .ways { padding: clamp(2.5rem, 7vh, 5rem) 0; border-bottom: 1px solid var(--line); display: block; }
  .way h2 { font-weight: 500; font-size: var(--s2); line-height: 1.15; margin-bottom: .8rem; } .way p { max-width: 34ch; margin-bottom: 1rem; }
  @media (max-width: 860px) { .ways { grid-template-columns: 1fr; } }
  .att .door { font-size: var(--s1); line-height: 1.45; max-width: 42ch; margin-bottom: 1.2rem; } .att .door::first-line { font-weight: 500; }
  .btn { display: inline-block; font-family: var(--mono); font-size: var(--s-1); text-transform: uppercase; letter-spacing: 0.08em; background: var(--ink); color: var(--paper); border-radius: 2rem; padding: 0.7rem 1.3rem; text-decoration: none; }
  .how { margin-top: 1rem; color: var(--grey); font-size: var(--s-1); }
  footer { padding: 2.5rem 0 3.5rem; display: flex; flex-wrap: wrap; gap: 1.6rem; align-items: baseline; }
  footer a { color: var(--ink); }
  footer .label { margin: 0; }
  footer .agents { flex-basis: 100%; color: var(--grey); } footer .agents a { color: var(--grey); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media all {
    :root { --paper: #111014; --ink: hsl(45, 20%, 94%); --grey: hsl(240, 5%, 66%); --line: hsl(240, 5%, 22%); }
  }
  .hire-open { font: inherit; color: var(--ink, var(--fg)); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 0.15em; min-height: 44px; }
  dialog#hire { width: min(34rem, calc(100vw - 2rem)); margin: auto; padding: 1.618rem; background: var(--paper, var(--bg)); color: var(--ink, var(--fg)); border: 1px solid var(--line); border-radius: 0.6rem; }
  dialog#hire::backdrop { background: rgba(0, 0, 0, 0.6); }

  #hire-thanks { margin: 0.6rem 0 0; font-size: var(--s1, 1.25rem); outline: none; }

  #hire input[type=email], #hire textarea { width: 100%; font: inherit; color: inherit; background: transparent; border: 1px solid var(--grey, var(--muted)); border-radius: 0.4rem; padding: 0.6rem 0.7rem; }
  #hire textarea { min-height: 8.5rem; resize: vertical; }
  #hire .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  #hire .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 0.6rem; }
  #hire button.btn { font-family: var(--mono); font-size: var(--s-1); text-transform: uppercase; letter-spacing: 0.08em; background: var(--ink, var(--fg)); color: var(--paper, var(--bg)); border: 0; border-radius: 2rem; padding: 0.7rem 1.3rem; min-height: 44px; cursor: pointer; }
  #hire button.btn:disabled { opacity: 0.5; }

<body>
<div class="wrap">

<header class="bar">
  <span class="label">proofbridge</span>
  <a class="label" href="https://interactiondesign.nl/">Dennis Jansen ↗</a>
</header>

<section class="intro" aria-labelledby="h1">
  <h1 id="h1">I find the real problem before you build the wrong solution.</h1>
</section>

<section class="ways" aria-label="The lens">
  <div class="way"><p>Your AI, my lens. Connect it and say: use the UX lens.</p><p><a class="btn" href="/mcp/">Connect the lens</a></p></div>
</section>

<footer>
  <span class="label">↳ connect</span>
  <a href="mailto:ask@proofbridge.nl">ask@proofbridge.nl</a>
  <a href="https://interactiondesign.nl/">interactiondesign.nl</a>
  <button type="button" class="hire-open" id="hire-open">hire me</button>
</footer>

</div>
<dialog id="hire" aria-labelledby="hire-h">
  <form id="hire-form" novalidate>
    <span class="label" id="hire-h">↳ hire me</span>
    <label for="hire-email">Your email</label>
    <input id="hire-email" type="email" autocomplete="email" inputmode="email" required>
    <label for="hire-context">Context</label>
    <textarea id="hire-context" maxlength="4000" required></textarea>
    <input type="text" class="hp" id="hire-website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="row"><button type="submit" class="btn" id="hire-send">Send</button><button type="button" class="hire-close" id="hire-close">Close</button><span id="hire-msg" role="status"></span></p>
  </form>
  <div id="hire-done" role="status" hidden>
    <span class="label">↳ hire me</span>
    <p id="hire-thanks" tabindex="-1">Thank you for your interest. I get back to you soon.</p>
    <p class="row"><button type="button" class="hire-close" id="hire-close2">Close</button></p>
  </div>
</dialog>
<script>
(() => {
  const D = document.getElementById('hire'), F = document.getElementById('hire-form'), M = document.getElementById('hire-msg'), S = document.getElementById('hire-send');
  const E = document.getElementById('hire-email'), C = document.getElementById('hire-context');
  document.getElementById('hire-open').onclick = () => { M.textContent = ''; D.showModal(); if (!F.hidden) E.focus(); };
  document.getElementById('hire-close').onclick = () => D.close();
  document.getElementById('hire-close2').onclick = () => D.close();
  F.onsubmit = async e => { e.preventDefault();
    const email = E.value.trim(), context = C.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) { M.textContent = 'That address looks incomplete.'; E.focus(); return; }
    if (!context) { M.textContent = 'Give me some context.'; C.focus(); return; }
    S.disabled = true; M.textContent = 'Sending.';
    try {
      const r = await fetch('https://proofbridge-send.dennis-f79.workers.dev/hire', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ email, context, website: document.getElementById('hire-website').value }) });
      const j = await r.json().catch(() => ({}));
      if (j.ok) { F.hidden = true; const T = document.getElementById('hire-done'); T.hidden = false; document.getElementById('hire-thanks').focus(); return; }
      M.textContent = j.error === 'email' ? 'That address looks incomplete.' : j.error === 'rate' ? 'Too fast. Try again in a minute.' : 'Not sent. Mail me at info@interactiondesign.nl.';
    } catch { M.textContent = 'Not sent. Mail me at info@interactiondesign.nl.'; }
    S.disabled = false; };
})();
</script>
