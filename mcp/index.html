<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX lens · proofbridge</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --paper: #111014; --ink: hsl(45, 20%, 92%); --grey: hsl(240, 6%, 62%); --line: hsl(45, 6%, 24%); --accent: #b8862b;
    --s-1: clamp(0.8rem, 0.76rem + 0.2vw, 0.9rem); --s0: clamp(1rem, 0.95rem + 0.25vw, 1.15rem); --s1: clamp(1.25rem, 1.1rem + 0.5vw, 1.6rem); --s2: clamp(1.6rem, 1.4rem + 0.8vw, 2.4rem);
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; color-scheme: dark; }
  html { background: var(--paper); color: var(--ink); }
  body { font-family: "DM Sans", system-ui, -apple-system, Helvetica, sans-serif; font-weight: 300; font-size: var(--s0); line-height: 1.618; }
  .wrap { max-width: 61.8ch; margin: 0 auto; padding: 2.6rem max(16px, 4vw) 6rem; display: grid; gap: 2.6rem; }
  .label { font-family: var(--mono); font-size: var(--s-1); letter-spacing: .06em; text-transform: uppercase; color: var(--grey); display: block; margin-bottom: .8rem; }
  h1 { font-weight: 500; font-size: var(--s2); line-height: 1.15; max-width: 22ch; } h2 { font-weight: 500; font-size: var(--s1); line-height: 1.2; }
  section { border-top: 1px solid var(--line); padding-top: 1.6rem; display: grid; gap: .9rem; }
  p.lead { font-size: var(--s1); line-height: 1.3; color: var(--ink); }
  code, pre { font-family: var(--mono); font-size: .8rem; } pre { white-space: pre-wrap; word-break: break-all; color: var(--grey); border-left: 2px solid var(--line); padding-left: .8rem; }
  a { color: var(--ink); } .grey { color: var(--grey); }
  button { font: inherit; font-weight: 500; background: var(--ink); color: var(--paper); border: 0; border-radius: 2rem; padding: .6rem 1.2rem; cursor: pointer; } button:disabled { opacity: .5; }
  .addr { font-family: var(--mono); font-size: .85rem; word-break: break-all; color: var(--ink); background: #1a191e; border: 1px solid var(--line); border-radius: .5rem; padding: .7rem .9rem; }
  .status { font-family: var(--mono); font-size: .75rem; color: var(--grey); }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Position the UX lens for producing an app. If not guided, you are creating AI app slob.</h1>
</header>

<section>
  <p>Get your address, add it to your AI as a custom connector (no sign-in), then say in the chat: <strong>use the UX lens</strong>.</p>
  <p><button id="get" type="button">Get your address</button></p>
  <div id="out" hidden><div class="addr" id="addr"></div><p class="grey" id="note"></p></div>
</section>

</div>
<script>
(() => {
  const R = 'https://proofbridge-send.dennis-f79.workers.dev/mcp';
  const b = document.getElementById('get'), out = document.getElementById('out'), addr = document.getElementById('addr'), note = document.getElementById('note');
  b.onclick = async () => { b.disabled = true;
    try { const r = await fetch(R + '/address', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ client: 'page' }) }); const j = await r.json();
      if (j.ok) { addr.textContent = j.address; note.textContent = (j.reused ? 'The latest address made for you today. ' : 'Yours. Keep it. ') + j.free_readings + ' readings free, then ' + j.price_sats + ' sats each over Lightning, asked in the chat.'; out.hidden = false; }
      else { note.textContent = j.detail || j.error; out.hidden = false; }
    } catch { note.textContent = 'The door did not answer.'; out.hidden = false; }
    b.disabled = false; };
})();
</script>
</body>
</html>
