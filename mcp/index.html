<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebAPI", "name": "proofbridge UX lens (MCP)", "provider": {"@type": "Person", "name": "Dennis Jansen", "email": "ask@proofbridge.nl", "url": "https://proofbridge.nl/"}, "description": "A text, the UX lens, that an AI loads and reads the user's material with in the user's own chat.", "documentation": "https://proofbridge.nl/mcp/index.md", "termsOfService": "https://proofbridge.nl/mcp/index.md", "proofbridge:what_leaves_the_chat": "Nothing. The door has no tool that receives material, quotes or readings.", "proofbridge:what_is_recorded": "That an address was made and when the lens text was loaded; the caller's network address only as a salted hash, to bound addresses per day.", "proofbridge:verify": "The door states the sha256 of the lens text it serves (GET /mcp/status); the same text is public in the repository.", "proofbridge:source": "https://github.com/theden1974/proofbridge_website/tree/main/worker/src", "proofbridge:status": "https://proofbridge-send.dennis-f79.workers.dev/mcp/status"}</script>

<body>
<div class="wrap">
<header>
  <h1>A business plan, a framework, a website, a startup plan: put it through the UX lens before you build on it.</h1>
  <p class="sub">If not guided, you are creating AI slob.</p>
</header>

<section>
  <p>Get your address, add it to your AI as a custom connector (no sign-in), then say in the chat: <strong>use the UX lens</strong>.</p>
  <p><button id="get" type="button">Get your address</button></p>
  <div id="out" hidden><div class="addrrow"><div class="addr" id="addr"></div><button type="button" class="copy" id="copy" aria-label="Copy the address" title="Copy" hidden><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span id="copytag">Copy</span></button></div><p class="grey" id="note"></p></div>
</section>

</div>
<script>
(() => {
  const R = 'https://proofbridge-send.dennis-f79.workers.dev/mcp';
  const b = document.getElementById('get'), out = document.getElementById('out'), addr = document.getElementById('addr'), note = document.getElementById('note');
  const cp = document.getElementById('copy');
  cp.onclick = async () => { const v = addr.textContent; let ok = false; try { await navigator.clipboard.writeText(v); ok = true; } catch { try { const r = document.createRange(); r.selectNodeContents(addr); const s = getSelection(); s.removeAllRanges(); s.addRange(r); ok = document.execCommand('copy'); } catch {} }
    if (ok) { const tag = document.getElementById('copytag'); cp.classList.add('done'); tag.textContent = 'Copied'; setTimeout(() => { cp.classList.remove('done'); tag.textContent = 'Copy'; }, 1200); } };
  b.onclick = async () => { b.disabled = true;
    try { const r = await fetch(R + '/address', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ client: 'page' }) }); const j = await r.json();
      if (j.ok) { addr.textContent = j.address; cp.hidden = false; note.textContent = (j.reused ? 'The latest address made for you today. ' : 'Yours. Keep it.') + (j.free_readings < 1000 ? ' ' + j.free_readings + ' readings free, then ' + j.price_sats + ' sats each over Lightning, asked in the chat.' : ' Free for now.'); out.hidden = false; }
      else { note.textContent = j.detail || j.error; out.hidden = false; }
    } catch { note.textContent = 'The door did not answer.'; out.hidden = false; }
    b.disabled = false; };
})();
</script>
